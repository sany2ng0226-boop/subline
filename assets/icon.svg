<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- 单一图标母版（Subline）：满版出血，白底。各平台在生成脚本里做各自取景：
       - iOS（apps/ios/scripts/gen-icons.mjs）：直接满版用，圆角由系统加。
       - macOS（apps/macos/scripts/gen-icon.mjs）：缩进 848 + 圆角 + 居中于 1024 透明画布
         （留 88 边给阴影），符合 Big Sur 图标网格。
       - Web（apps/web/scripts/gen-icons.mjs）：PWA 各尺寸与可遮罩图标。
       图形即界面本身：上行深色原文、下行蓝色译文、末尾光标；颜色取自 UI 主题的 rt-ink 与 rt-accent 变量。 -->
  <rect width="1024" height="1024" fill="#FFFFFF"/>
  <rect x="184" y="380" width="656" height="88" rx="44" fill="#18181B"/>
  <rect x="184" y="548" width="456" height="88" rx="44" fill="#3557D6"/>
  <rect x="688" y="532" width="32" height="120" rx="16" fill="#3557D6"/>
</svg>
