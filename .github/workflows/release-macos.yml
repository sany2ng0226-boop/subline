name: macOS release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

concurrency:
  group: release-macos-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-latest
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    env:
      TEAM_ID: R9LRJU53ZG
      TAG: ${{ github.ref_name }}
      NODE_LLAMA_CPP_SKIP_DOWNLOAD: 'true'
      CSC_NAME: JIANG ZIYANG (R9LRJU53ZG)
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Verify release version
        run: |
          set -euo pipefail
          echo "CSC_KEYCHAIN=$RUNNER_TEMP/release-signing.keychain-db" >> "$GITHUB_ENV"
          node <<'NODE'
          const app = require('./apps/macos/package.json').version;
          const root = require('./package.json').version;
          if (process.env.TAG.slice(1) !== app || root !== app) {
            throw new Error(`Tag ${process.env.TAG}, macOS ${app}, root ${root} must match; run pnpm version:sync before tagging`);
          }
          NODE
      - name: Install locked dependencies
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile
      - name: CI tests and type checks
        run: |
          set -euo pipefail
          pnpm --filter @rt/core test
          pnpm exec vitest run --config packages/ui/vitest.config.ts packages/ui/src apps/macos/renderer-build.test.ts
          pnpm exec vitest run packages/ui/src/composables/useTranscription.test.ts apps/macos/src/main/translation/request-queue.test.ts apps/macos/test/stage-metrics.test.ts apps/macos/src/main/translation/hy-translator.test.ts
          pnpm --filter @rt/macos test-model-integrity
          pnpm --filter @rt/macos type-check
          pnpm --filter @rt/web type-check
          pnpm --filter @rt/ios type-check
          pnpm --filter @rt/ios gen:models --check
      - name: Import release signing certificate
        env:
          MACOS_CERT_P12_BASE64: ${{ secrets.MACOS_CERT_P12_BASE64 }}
          MACOS_CERT_P12_PASSWORD: ${{ secrets.MACOS_CERT_P12_PASSWORD }}
        run: |
          set -euo pipefail
          umask 077
          security list-keychains -d user > "$RUNNER_TEMP/original-keychains.txt"
          keychain_password="$(openssl rand -hex 32)"
          echo "::add-mask::$keychain_password"
          printf '%s' "$MACOS_CERT_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/release-cert.p12"
          security create-keychain -p "$keychain_password" "$CSC_KEYCHAIN"
          security set-keychain-settings -lut 21600 "$CSC_KEYCHAIN"
          security unlock-keychain -p "$keychain_password" "$CSC_KEYCHAIN"
          security import "$RUNNER_TEMP/release-cert.p12" -P "$MACOS_CERT_P12_PASSWORD" -k "$CSC_KEYCHAIN" -T /usr/bin/codesign -T /usr/bin/security
          rm -f "$RUNNER_TEMP/release-cert.p12"
          original_keychains=()
          while IFS= read -r line; do
            line="${line#*\"}"
            original_keychains+=("${line%\"*}")
          done < "$RUNNER_TEMP/original-keychains.txt"
          security list-keychains -d user -s "$CSC_KEYCHAIN" "${original_keychains[@]}"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" "$CSC_KEYCHAIN"
      - name: Build signed arm64 application
        run: |
          set -euo pipefail
          # --manual-notarize passes mac.notarize=false; existing hardened runtime
          # and build/entitlements.mac.plist apply to the app and inherited helpers.
          pnpm --filter @rt/macos exec node scripts/package-mac.mjs --dir --manual-notarize
      - name: Notarize application, then package and notarize DMG
        env:
          APPLE_API_KEY_P8_BASE64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: |
          set -euo pipefail
          umask 077
          printf '%s' "$APPLE_API_KEY_P8_BASE64" | base64 --decode > "$RUNNER_TEMP/AuthKey.p8"
          chmod 600 "$RUNNER_TEMP/AuthKey.p8"
          notarize() {
            local artifact="$1" result="$2" submission_id status
            if xcrun notarytool submit "$artifact" --wait \
              --key "$RUNNER_TEMP/AuthKey.p8" --key-id "$APPLE_API_KEY_ID" \
              --issuer "$APPLE_API_ISSUER_ID" --output-format json > "$result"; then
              status="$(jq -r '.status // empty' "$result")"
            else
              status=Failed
            fi
            cat "$result"
            if [[ "$status" != Accepted ]]; then
              submission_id="$(jq -r '.id // empty' "$result" 2>/dev/null || true)"
              if [[ -n "$submission_id" ]]; then
                xcrun notarytool log "$submission_id" --key "$RUNNER_TEMP/AuthKey.p8" \
                  --key-id "$APPLE_API_KEY_ID" --issuer "$APPLE_API_ISSUER_ID" || true
              fi
              return 1
            fi
          }
          app="$GITHUB_WORKSPACE/apps/macos/release/mac-arm64/Subline.app"
          ditto -c -k --keepParent "$app" "$RUNNER_TEMP/Subline.zip"
          notarize "$RUNNER_TEMP/Subline.zip" "$RUNNER_TEMP/app-notary.json"
          xcrun stapler staple "$app"
          # Reuse the deployment produced by package-mac.mjs. --prepackaged
          # wraps the stapled app without rebuilding or re-signing its contents.
          version="${TAG#v}"
          # shellcheck disable=SC2016
          (cd .deploy-macos && ./node_modules/.bin/electron-builder --mac dmg --arm64 \
            --prepackaged "$app" --publish never -c.mac.notarize=false \
            -c.extraMetadata.version="$version" \
            -c.directories.output="$GITHUB_WORKSPACE/apps/macos/release" \
            -c.artifactName='Subline-${version}-arm64.${ext}')
          dmg="$GITHUB_WORKSPACE/apps/macos/release/Subline-${version}-arm64.dmg"
          codesign --force --timestamp --sign "Developer ID Application: $CSC_NAME" --keychain "$CSC_KEYCHAIN" "$dmg"
          notarize "$dmg" "$RUNNER_TEMP/dmg-notary.json"
          xcrun stapler staple "$dmg"
      - name: Verify release artifacts and hash DMG
        run: |
          set -euo pipefail
          app="$GITHUB_WORKSPACE/apps/macos/release/mac-arm64/Subline.app"
          dmg="apps/macos/release/Subline-${TAG#v}-arm64.dmg"
          codesign --verify --deep --strict --verbose=2 "$app"
          spctl -a -vvv -t exec "$app"
          spctl -a -vvv -t open --context context:primary-signature "$dmg"
          xcrun stapler validate "$app"
          xcrun stapler validate "$dmg"
          (cd apps/macos/release && shasum -a 256 "$(basename "$dmg")" > "$(basename "$dmg").sha256")
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          flags=()
          if [[ "$TAG" == *-* ]]; then flags+=(--prerelease); fi
          dmg="apps/macos/release/Subline-${TAG#v}-arm64.dmg"
          gh release create "$TAG" --verify-tag --generate-notes "${flags[@]}" "$dmg" "$dmg.sha256"
      - name: Clean up signing material
        if: always()
        run: |
          set -euo pipefail
          cleanup_status=0
          if [[ -f "$RUNNER_TEMP/original-keychains.txt" ]]; then
            original_keychains=()
            while IFS= read -r line; do
              line="${line#*\"}"
              original_keychains+=("${line%\"*}")
            done < "$RUNNER_TEMP/original-keychains.txt"
            security list-keychains -d user -s "${original_keychains[@]}" || cleanup_status=$?
          fi
          if [[ -n "${CSC_KEYCHAIN:-}" && -f "$CSC_KEYCHAIN" ]]; then
            security delete-keychain "$CSC_KEYCHAIN" || cleanup_status=$?
          fi
          rm -f "$RUNNER_TEMP/AuthKey.p8" "$RUNNER_TEMP/release-cert.p12"
          exit "$cleanup_status"
