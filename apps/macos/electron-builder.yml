appId: io.github.sany2ng0226.classroomtranslator
productName: Subline
directories:
  output: release
  buildResources: build
# electron-vite 产物在 out/；node_modules 由 electron-builder 按生产依赖自动包含
files:
  - out/**
  - "!**/node_modules/@node-llama-cpp/linux*/**"
  - "!**/node_modules/@node-llama-cpp/win*/**"
  - "!**/node_modules/@node-llama-cpp/mac-x64/**"
  - package.json
  # onnxruntime-node 自带全平台二进制，仅保留 macOS arm64，去掉 linux/win/x64 以瘦身
  - "!**/node_modules/onnxruntime-node/bin/napi-v6/linux/**"
  - "!**/node_modules/onnxruntime-node/bin/napi-v6/win32/**"
  - "!**/node_modules/onnxruntime-node/bin/napi-v6/darwin/x64/**"
# The isolated Node translator must resolve its complete ESM dependency tree outside asar.
asarUnpack:
  - "out/main/**"
  - "**/node_modules/**"
# 原生模块是 N-API 预编译产物（ABI 稳定），无需也不应重新编译
extraResources:
  - from: build/HY-MT2-LICENSE.txt
    to: licenses/HY-MT2-LICENSE.txt
npmRebuild: false
mac:
  # Keep notarize unset: electron-builder 25+ auto-notarizes after signing when
  # APPLE_ID + APPLE_APP_SPECIFIC_PASSWORD + APPLE_TEAM_ID are set, or
  # APPLE_API_KEY (path to .p8) + APPLE_API_KEY_ID + APPLE_API_ISSUER, or
  # APPLE_KEYCHAIN_PROFILE (+ optional APPLE_KEYCHAIN).
  # No credentials: notarization is skipped. Partial sets may fail the build.
  # Manual signing/notarization remains separate; see docs/release/notarize.md.
  minimumSystemVersion: "14.2"
  category: public.app-category.productivity
  icon: build/icon.icns
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  extendInfo:
    NSMicrophoneUsageDescription: 用于实时识别与翻译语音。语音识别在本机完成，音频不会上传；仅当你启用云端翻译时，识别出的文字会发送到你配置的翻译服务。
    NSAudioCaptureUsageDescription: 用于实时识别与翻译系统播放的声音。语音识别在本机完成，音频不会上传；仅当你启用云端翻译时，识别出的文字会发送到你配置的翻译服务。
  target:
    - target: dmg
      arch: [arm64]
dmg:
  title: ${productName}
